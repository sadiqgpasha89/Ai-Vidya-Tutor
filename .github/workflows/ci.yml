name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap ffmpeg
      - run: pip install -r requirements-dev.txt
      - run: ruff check backend tests scripts evals
      - run: python -m pytest
      - run: TEACHER_MOCK=1 python evals/run.py --self-test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: for f in frontend/*.js; do node --check "$f"; done
      - run: node --test tests/js/*.test.mjs
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/i18n_extract.py --strict || true   # report translation coverage (core strings are expected to be translated over time)
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vidya:ci .
